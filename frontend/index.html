<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primary -->
    <title>Ilyon Academy | Bimbingan Belajar Anak di Sukabumi</title>

    <meta
      name="description"
      content="Ilyon Academy adalah bimbingan belajar anak di Kota Sukabumi. Tersedia les calistung, matematika, bahasa Inggris, Mandarin, Jepang, TKA, privat, dan kelas reguler untuk PAUD hingga SMP."
    />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <link rel="canonical" href="https://ilyon.id/" />

    <!-- Language -->
    <meta http-equiv="content-language" content="id" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/ilyon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph (Facebook, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Ilyon Academy" />
    <meta
      property="og:title"
      content="Ilyon Academy | Bimbingan Belajar Anak di Sukabumi"
    />
    <meta
      property="og:description"
      content="Tempat belajar anak yang menyenangkan di Sukabumi. Les privat, calistung, matematika, bahasa asing, dan program belajar lainnya."
    />
    <meta property="og:url" content="https://ilyon.id/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Ilyon Academy | Bimbingan Belajar Sukabumi"
    />
    <meta
      name="twitter:description"
      content="Bimbingan belajar anak PAUD hingga SMP di Kota Sukabumi."
    />

    <!-- Structured Data: Local Educational Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Ilyon Academy",
        "url": "https://ilyon.id/",
        "description": "Bimbingan belajar anak di Kota Sukabumi yang menyediakan program calistung, kelas reguler, les privat, matematika, bahasa asing, TKA, dan program pembelajaran lainnya.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kota Sukabumi",
          "addressRegion": "Jawa Barat",
          "addressCountry": "ID"
        },
        "areaServed": {
          "@type": "City",
          "name": "Kota Sukabumi"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
